    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Islam",
        "url": "https://islam.house/",
        "description": "Accurate prayer times, the full Quran, authenticated hadith, and daily duas, sourced transparently and free.",

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Epilogue:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Islam, Grounded Daily Practice</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('islam-settings');
          var theme = 'light';
          var language = 'en';
          if (raw) {
            var state = JSON.parse(raw).state;
            if (state && state.theme) theme = state.theme;
            if (state && state.language) language = state.language;
          }
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.lang = language;
          document.documentElement.dir = language === 'ar' || language === 'ur' ? 'rtl' : 'ltr';
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
